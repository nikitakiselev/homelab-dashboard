name: Предложение
description: Задача пользователя и предлагаемое изменение
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую задачу нужно решить
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Предлагаемое поведение
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Рассмотренные варианты и ограничения
