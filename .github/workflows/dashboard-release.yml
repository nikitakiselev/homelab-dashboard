name: Dashboard image
on:
  push:
    tags: ["dashboard-v*"]
permissions:
  contents: write
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v
      - name: Validate stable version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -c 'import os,re;assert re.fullmatch(r"dashboard-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)",os.environ["RELEASE_TAG"])'
          echo "value=${RELEASE_TAG#dashboard-v}" >> "$GITHUB_OUTPUT"
      - name: Test image update and rollback with persistent data
        run: |
          docker build --build-arg VERSION=0.0.0 --build-arg REVISION="$GITHUB_SHA" -t homelab-dashboard:test .
          docker build --build-arg VERSION=999.0.0 --build-arg REVISION="$GITHUB_SHA" -t homelab-dashboard:test-next .
          python3 tests/docker_smoke.py --image homelab-dashboard:test --next-image homelab-dashboard:test-next
          HOMELAB_DASHBOARD_TOKEN=synthetic-compose-validation-token docker compose config --quiet
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/nikitakiselev/homelab-dashboard:${{ steps.version.outputs.value }}
            ghcr.io/nikitakiselev/homelab-dashboard:stable
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish release notes and Compose files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" compose.yaml .env.example --title "Dashboard ${GITHUB_REF_NAME#dashboard-v}" --generate-notes --latest=false
