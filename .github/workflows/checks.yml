name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python3 -m pip install -r requirements.txt
      - run: sh -n install.sh
      - run: npm ci
      - run: npm run build
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tests/linux_smoke.py
