name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: go test -race ./...
        working-directory: agent
      - run: CGO_ENABLED=0 go build -trimpath -o ../releases/homelab-agent_linux_amd64 ./cmd/homelab-agent
        working-directory: agent
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python3 -m pip install -r requirements.txt
      - run: sh -n install.sh
      - run: npm ci
      - run: npm run build
      - run: node --experimental-strip-types --test tests/frontend/network-history.test.mjs
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tests/linux_smoke.py
      - name: Verify Go agent install and rollback
        run: docker run --rm --mount type=bind,src="$GITHUB_WORKSPACE",dst=/repo,readonly debian:12-slim sh /repo/tests/agent_install_smoke.sh
